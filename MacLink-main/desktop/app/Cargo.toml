[package]
name = "maclink-desktop"
description = "MacLink: the desktop app"
version.workspace = true
edition.workspace = true
# Above the workspace minimum: material-colors needs Rust 1.97.
rust-version = "1.97"
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "maclink-desktop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
data-encoding.workspace = true
dirs.workspace = true
hostname.workspace = true
material-colors.workspace = true
maclink-core.workspace = true
qrcode.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
cxx-qt-build = { workspace = true, features = ["link_qt_object_files"] }
cc = "1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
